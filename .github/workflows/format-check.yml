name: Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Drop private secrets submodule
        run: |
          rm -f .gitmodules
          git rm --cached secrets -q || true
          rm -rf secrets && mkdir -p secrets && touch secrets/.keep
          git -c user.email=ci@local -c user.name=ci add -A

      - name: Check formatting
        run: nix fmt -- --ci

      - name: Evaluate host configurations
        run: |
          for attr in \
            nixosConfigurations.imre \
            nixosConfigurations.newarre \
            darwinConfigurations.MacBookAir10-1-jose-cribeiro
          do
            echo "::group::$attr"
            nix eval --raw ".#$attr.config.system.build.toplevel.drvPath"
            echo
            echo "::endgroup::"
          done
